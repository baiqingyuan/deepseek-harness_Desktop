name: Build and Release

# 发布约定（默认：Release 页面 + 应用内更新 都要更新）
#   - 推 v* tag（或手动触发且不填 asset_tag）→ 新建一个正式 Release 条目并标记为 Latest，
#     同时上传 latest.json。客户端固定读 releases/latest/download/latest.json，
#     因此 Release 条目与应用内更新是同一份产物，两条链路一起生效。
#   - 只有在仓库根放 asset-tag.txt（内容形如 v0.8.0）或手动触发填 asset_tag 时，
#     才退回「覆盖上传到已有 Release、不新建条目」的应用内静默推送模式。
#     注意该模式下若已存在更新的 Release，/releases/latest 不会指向它，
#     客户端将读不到更新 —— 校验步骤会对此告警，正常发版不要用它。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0); 仅手动触发时生效"
        required: true
        default: "1.0.0"
      asset_tag:
        description: "仅特殊场景使用：把产物覆盖上传到这个已存在的 Release（如 v0.8.0），不新建发行版。留空=新建 Release（推荐）"
        required: false
        default: ""

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # `if:` 条件中不允许引用 secrets 上下文（会报 Unrecognized named-value: 'secrets'，
      # 导致整个工作流文件非法、一次 job 都不跑）。因此在这里先把「是否配置了 SignPath」
      # 求值成普通环境变量，下面的步骤再用 env.SIGNPATH_ENABLED 判断。
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install NSIS
        # CI 环境预装 makensis，供 build.ps1 第 6 步编译 Setup.exe 使用。
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # choco 不会把 NSIS 加入 PATH，这里显式加入，供 build.ps1 通过 Get-Command makensis 找到
          echo "C:\Program Files (x86)\NSIS" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Resolve version and target release
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $v = '${{ inputs.version }}'
          }
          # 应用内更新：产物覆盖上传到「已存在的」某个 Release，不新建发行版条目。
          # 优先用手动触发时填的 asset_tag；否则读仓库根的 asset-tag.txt（内容形如 v0.8.0）；
          # 两者都为空时才按正常流程发布新 Release。
          $target = '${{ inputs.asset_tag }}'
          if (-not $target -and (Test-Path 'asset-tag.txt')) {
            $target = (Get-Content -LiteralPath 'asset-tag.txt' -Raw).Trim()
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "asset_tag=$target" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v  asset_tag=$target"

      - name: Build
        id: build
        shell: pwsh
        run: |
          # 把完整输出留一份到 build.log：CI 日志需要管理员权限才能下载，
          # 出错时靠它把真正的错误（csc / makensis / pnpm）公开出来。
          & ./build.ps1 -Version ${{ steps.meta.outputs.version }} *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report build failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $title = "CI 构建失败 v${{ steps.meta.outputs.version }}"
          if (Test-Path build.log) {
            $log = Get-Content -LiteralPath build.log -Raw
            if ($log.Length -gt 60000) { $log = $log.Substring($log.Length - 60000) }
            Set-Content -LiteralPath issue-body.md -Value $log -Encoding UTF8
          } else {
            Set-Content -LiteralPath issue-body.md -Value "没有 build.log，请查看 Actions 运行日志。" -Encoding UTF8
          }
          gh issue create --title $title --body-file issue-body.md

      - name: Close stale build-failure issues
        # 构建成功后把之前自动开的「CI 构建失败」issue 关掉，避免堆积噪音。
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ids = gh issue list --state open --search "CI 构建失败 in:title" --json number --jq ".[].number"
          foreach ($id in $ids) { gh issue close $id }
          if ($ids) { Write-Host "closed issues: $ids" }

      # 启动冒烟测试：编译通过 ≠ 能运行。
      # v0.7.0 就是编译正常但构造界面时抛异常、进程秒退，用户双击毫无反应。
      # 这里真跑一次 exe，若进程立刻消失就阻断发布，并打印崩溃堆栈。
      - name: Smoke test (launch exe)
        shell: pwsh
        run: |
          $exe = "dist/DeepSeekHarness/DeepSeekHarness.exe"
          if (-not (Test-Path $exe)) { throw "未找到构建产物：$exe" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $alive = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          if (-not $alive) {
            Write-Host "::error::进程启动后立即退出（疑似启动崩溃）"
            Get-WinEvent -FilterHashtable @{LogName='Application'; Level=1,2; StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue |
              Select-Object -First 4 | ForEach-Object { Write-Host "EVENT: $($_.ProviderName) $($_.Message)" }
            throw "启动冒烟测试失败：进程在 15 秒内退出"
          }
          Write-Host "冒烟测试通过：进程存活，主窗口标题=[$($alive.MainWindowTitle)]"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Package
        shell: pwsh
        run: ./package-release.ps1 -Version ${{ steps.meta.outputs.version }}

      # ---- SignPath 代码签名（免费 OSS 证书，OV 级，受 Windows 信任）----
      # 仅在仓库配置了 SIGNPATH_API_TOKEN 等 Secrets 时执行；否则整段跳过，照常发布未签名包。
      # 需要在 SignPath 控制台配置：Organization、Project、Signing Policy、Artifact Configuration（root type = ZIP，匹配 *.exe）。
      - name: Upload unsigned Setup.exe for signing
        id: upload-unsigned
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/DeepSeekHarness-Setup-*.exe

      - name: Submit signing request to SignPath
        id: signpath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Replace dist with signed Setup.exe
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          # SignPath 把签名结果下载到 signed/，覆盖回 dist/，后续发布步骤复用同一路径
          Copy-Item -Path "signed/dist/*" -Destination "dist/" -Recurse -Force

      - name: Build release notes from CHANGELOG
        id: notes
        shell: pwsh
        env:
          REL_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # 从 CHANGELOG.md 取出当前版本那一段作为 Release 说明（以前每次 Release 说明都是空的）。
          $v = $env:REL_VERSION
          $body = ""
          if (Test-Path "CHANGELOG.md") {
            $lines = Get-Content -LiteralPath "CHANGELOG.md" -Encoding UTF8
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match ("^##\s+\[?" + [regex]::Escape($v) + "\b")) { $start = $i + 1; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($j = $start; $j -lt $lines.Count; $j++) {
                if ($lines[$j] -match "^##\s+") { $end = $j; break }
              }
              $body = ($lines[$start..($end - 1)] -join "`n").Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($body)) { $body = "详见 CHANGELOG.md" }
          # 同时落盘，供下一步生成 latest.json 复用（多行正文不适合直接插进后续步骤的脚本）
          [System.IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP "rel-notes.md"), $body,
            (New-Object System.Text.UTF8Encoding($false)))
          $delim = "NOTES_EOF"
          @("body<<$delim", $body, $delim) | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Generate latest.json (update manifest)
        # 客户端的更新检查优先读这份静态清单，而不是 GitHub API：
        # release 资源下载域名没有匿名 API 限流（60 次/小时/IP），同一出口 IP 下多人使用也能拿到更新。
        shell: pwsh
        env:
          REL_VERSION: ${{ steps.meta.outputs.version }}
          ASSET_TAG: ${{ steps.meta.outputs.asset_tag }}
        run: |
          $v = $env:REL_VERSION
          $repo = "${{ github.repository }}"
          # 应用内更新：产物挂在指定的旧 Release 上，但 latest.json 里的版本号是新的
          $tag = if ($env:ASSET_TAG) { $env:ASSET_TAG } else { "v$v" }
          $base = "https://github.com/$repo/releases/download/$tag"
          $setupName = "DeepSeekHarness-Setup-v$v-win-x64.exe"
          $zipName   = "DeepSeekHarness-Desktop-v$v-win-x64.zip"

          $setupItem = Get-Item "dist/$setupName" -ErrorAction SilentlyContinue
          $zipItem   = Get-Item "dist/$zipName"   -ErrorAction SilentlyContinue

          $notes = ""
          $notesFile = Join-Path $env:RUNNER_TEMP "rel-notes.md"
          if (Test-Path $notesFile) { $notes = (Get-Content -LiteralPath $notesFile -Raw -Encoding UTF8).Trim() }

          # 可选「最低可用版本」：需要强制老客户端升级时，在仓库根放一行版本号（如 0.6.0）。
          # 低于它的客户端每次启动都会弹窗要求升级；文件不存在或内容非法则视为不限制。
          $minVersion = $null
          if (Test-Path "minimum-version.txt") {
            $t = (Get-Content -LiteralPath "minimum-version.txt" -Raw).Trim()
            if ($t -match '^\d+(\.\d+)*$') { $minVersion = $t }
          }

          $installer = $null
          if ($setupItem) {
            $installer = [ordered]@{ url = "$base/$setupName"; name = $setupName; size = $setupItem.Length }
          }
          $portable = $null
          if ($zipItem) {
            $portable = [ordered]@{ url = "$base/$zipName"; name = $zipName; size = $zipItem.Length }
          }

          $manifest = [ordered]@{
            version        = $v
            minimumVersion = $minVersion
            publishedAt    = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            notes          = $notes
            page           = "https://github.com/$repo/releases/tag/$tag"
            installer      = $installer
            portable       = $portable
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            "dist/latest.json", $json,
            (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "latest.json:"
          Write-Host $json

      - name: Upload assets to existing release (in-app update, no new release page)
        # 只在手动触发且填了 asset_tag 时执行：把新产物覆盖到已有的那个 Release，
        # 客户端读到的 latest.json 版本号是新的，于是走应用内更新，而 Releases 页面不新增条目。
        if: steps.meta.outputs.asset_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_TAG: ${{ steps.meta.outputs.asset_tag }}
        run: |
          gh release upload "$env:ASSET_TAG" `
            dist/DeepSeekHarness-Desktop-*.zip `
            dist/DeepSeekHarness-Setup-*.exe `
            dist/latest.json --clobber
          Write-Host "已覆盖上传至 $env:ASSET_TAG（不新建 Release）"
          # 清掉旧版本的 zip/Setup 资产（保留 latest.json），Release 页面只留当前版本，
          # 也避免应用内更新清单与旧安装包混淆。
          $v = '${{ steps.meta.outputs.version }}'
          $assets = gh release view "$env:ASSET_TAG" --json assets --jq '.assets[].name'
          foreach ($n in $assets) {
            if ($n -eq 'latest.json') { continue }
            if ($n -like 'DeepSeekHarness-*' -and $n -notlike "*-v$v-*") {
              Write-Host "删除旧资产: $n"
              gh release delete-asset "$env:ASSET_TAG" "$n" --yes
            }
          }

      - name: Upload release assets
        if: steps.meta.outputs.asset_tag == ''
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          # 应用内更新读的是 releases/latest/download/latest.json：
          # 必须显式把本次 Release 设为 Latest，否则客户端拿到的还是旧清单。
          make_latest: true
          files: |
            dist/DeepSeekHarness-Desktop-*.zip
            dist/DeepSeekHarness-Setup-*.exe
            dist/latest.json

      - name: Verify release entry + in-app update manifest
        # 「构建成功」不等于「用户能收到更新」。这里把两条链路都验一遍：
        #   1) Release 页面条目存在且资产齐全（zip / Setup / latest.json）；
        #   2) 更新清单指向本次版本；
        #   3) 清单里的安装包与便携包链接可下载（Range 请求，只取 2 字节）。
        #   1、2 任一不满足即构建失败；3 只告警 —— 它是网络探测，不该因为 CDN 抖动
        #   把一次其实成功的发布判死。
        # 每一步的结果都写进 verify.log，失败时由末尾步骤发成 issue（CI 日志无权限下载）。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_VERSION: ${{ steps.meta.outputs.version }}
          ASSET_TAG: ${{ steps.meta.outputs.asset_tag }}
        run: |
          $v = $env:REL_VERSION
          $repo = "${{ github.repository }}"
          $tag = if ($env:ASSET_TAG) { $env:ASSET_TAG } else { "v$v" }
          $log = New-Object System.Collections.ArrayList
          function Say($m) { Write-Host $m; [void]$log.Add($m) }
          $fatal = @()

          # 1) Release 条目与资产
          try {
            $names = @(gh release view "$tag" --json assets --jq '.assets[].name')
            Say "Release $tag 现有资产: $($names -join ', ')"
            foreach ($need in @("latest.json", "DeepSeekHarness-Setup-v$v-win-x64.exe", "DeepSeekHarness-Desktop-v$v-win-x64.zip")) {
              if ($names -notcontains $need) { $fatal += "缺少资产: $need" }
            }
            if (-not $fatal) { Say "[ok] 1) Release 条目与资产齐全" }
          } catch { $fatal += "无法读取 Release $tag : $($_.Exception.Message)" }

          # 2) 应用内更新清单：客户端固定读 releases/latest/download/latest.json，
          #    所以默认模式校验它；覆盖上传模式（产物挂在旧 Release 上）则校验那个 Release 的清单。
          if ($env:ASSET_TAG) {
            $manifestUrl = "https://github.com/$repo/releases/download/$tag/latest.json"
          } else {
            $manifestUrl = "https://github.com/$repo/releases/latest/download/latest.json"
          }
          $manifest = $null
          $lastErr = ""
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 6
            try {
              $req = [System.Net.HttpWebRequest]::Create("$($manifestUrl)?nocache=$i")
              $req.Method = 'GET'
              $req.UserAgent = 'DeepSeekHarness-CI'
              $req.Headers['Cache-Control'] = 'no-cache'
              $resp = $req.GetResponse()
              $body = (New-Object System.IO.StreamReader($resp.GetResponseStream())).ReadToEnd()
              $resp.Close()
              $j = $body | ConvertFrom-Json
              if ($j.version -eq $v) { $manifest = $j; Say "[ok] 2) 清单已刷新为 $($j.version)（第 $i 次检查）"; break }
              Say "清单仍是 $($j.version)，等待刷新为 $v ... ($i)"
            } catch { $lastErr = $_.Exception.Message; Say "清单暂不可读: $lastErr ($i)" }
          }
          if (-not $manifest) { $fatal += "清单未指向 v$v（最后一次错误: $lastErr）。URL: $manifestUrl" }

          # 3) 下载链接可达性（只告警）
          if ($manifest) {
            foreach ($item in @($manifest.installer, $manifest.portable)) {
              if (-not $item) { continue }
              try {
                # 用 Range 只取前 2 字节：HEAD 在 release 下载域名上常被拒/超时
                $r = [System.Net.HttpWebRequest]::Create($item.url)
                $r.Method = 'GET'
                $r.AddRange(0, 1)
                $rs = $r.GetResponse()
                $code = [int]$rs.StatusCode
                $rs.Close()
                Say "[ok] 3) 可下载 $($item.name) -> HTTP $code"
              } catch {
                Say "::warning::链接探测失败（不阻断） $($item.name): $($_.Exception.Message)"
              }
            }
          }

          # 4) 覆盖上传模式：/releases/latest 若不是目标 Release，客户端读的还是别的版本
          if ($env:ASSET_TAG) {
            try {
              $latestTag = (gh release view --json tagName --jq '.tagName')
              if ($latestTag -ne $tag) {
                Say "::warning::当前 Latest 是 $latestTag，产物在 $tag；客户端读 /releases/latest 拿到的是 $latestTag 的清单。"
              }
            } catch { Say "::warning::无法确认 Latest: $($_.Exception.Message)" }
          }

          Set-Content -LiteralPath verify.log -Value $log -Encoding UTF8
          if ($fatal.Count -gt 0) {
            $msg = "发布校验失败：`n - " + ($fatal -join "`n - ")
            Say $msg
            throw $msg
          }
          Say "全部校验通过：Release 条目 + 应用内更新清单均指向 v$v"

      - name: Report release verification failure
        # 构建本身通过、但后续步骤（发布 / 校验）失败时，把诊断日志发成公开 issue。
        # CI 日志需要管理员权限才能下载，没有 token 时这是唯一能看到错误的方式。
        if: failure() && steps.build.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $parts = @()
          if (Test-Path verify.log) {
            $parts += "=== verify.log ==="
            $parts += (Get-Content -LiteralPath verify.log -Raw)
          }
          $parts += "`n=== build.log 末尾 60 行 ==="
          if (Test-Path build.log) { $parts += ((Get-Content -LiteralPath build.log -Tail 60) -join "`n") }
          else { $parts += "(无 build.log)" }
          $text = $parts -join "`n"
          if ($text.Length -gt 60000) { $text = $text.Substring($text.Length - 60000) }
          Set-Content -LiteralPath issue-body.md -Value $text -Encoding UTF8
          gh issue create --title "CI 构建失败 v${{ steps.meta.outputs.version }}（发布/校验阶段）" --body-file issue-body.md
